name: CI/CD Pipeline

# This workflow runs on two triggers:
# 1. When code is pushed to the 'main' branch

# 2. When a Pull Request is opened/updated against the 'main' branch
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# ... (name: and on: are above) ...

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    # This starts a Postgres database *for this job*
    services:
      db:
        image: postgres:14-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: todo_db
        ports:
          - 5432:5432
        # This health check ensures the DB is ready before tests run
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      # Step 1: Get our project code onto the runner
      - name: Checkout code
        uses: actions/checkout@v3

      # Step 2: Install Node.js v18
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm' # Caches npm packages for faster builds
          cache-dependency-path: backend/package-lock.json

      # Step 3: Install our app's dependencies
      - name: Install dependencies
        run: npm install
        working-directory: ./backend

      # New Step: Initialize the database using your project's SQL file
      - name: Initialize Database
        run: docker exec -i ${{ job.services.db.id }} psql -U postgres -d todo_db < database/database.sql

      # Step 4: Run the tests. We must provide the DB env vars!
      - name: Run tests
        run: npm test
        working-directory: ./backend
        env:
          DB_HOST: localhost # GitHub maps service containers to localhost
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_NAME: todo_db

      # Step 5: Log in to Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_PASSWORD }}

      # Step 6: Build and push the Docker image
      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: ./backend # Build from the Dockerfile in the root
          file: ./backend/Dockerfile
          push: true # Actually push the image
          tags: ${{ secrets.DOCKER_HUB_USERNAME }}/devops-group-4:latest

  deploy:
      name: Deploy to Server
      runs-on: ubuntu-latest
      needs: build-and-test # 1. Wait for build-and-test to succeed
      if: github.ref == 'refs/heads/main' # 2. Only run this job on a push to 'main'

      steps:
        - name: Deploy to Server via SSH
          uses: appleboy/ssh-action@master
          with:
            host: ${{ secrets.HOST }}
            username: ${{ secrets.USERNAME }}
            key: ${{ secrets.SSH_PRIVATE_KEY }}
            script: |
              # Navigate to your project folder on the server
              cd /var/www/devops-group-4
              # Pull the latest code and images
              sudo git pull origin main
              sudo docker-compose pull
              # Restart the app with the new changes
              sudo docker-compose up -d