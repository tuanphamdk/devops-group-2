name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build_and_test:
    name: Build & Test
    runs-on: ubuntu-latest

    services:
      db:
        image: postgres:14-alpine
        env:
          POSTGRES_USER: devops
          POSTGRES_PASSWORD: devops123
          POSTGRES_DB: devops
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Initialize Database Schema
        run: PGPASSWORD=devops123 psql -h localhost -U devops -d devops -f ./database/database.sql

      - name: Install dependencies
        working-directory: ./backend
        run: npm install

      - name: Run tests
        working-directory: ./backend
        run: npm test
        env:
          DB_HOST: localhost
          DB_USER: devops        
          DB_PASSWORD: devops123   
          DB_NAME: devops
          DB_PORT: 5432

  push-to-docker:
    name: Push to Docker Hub
    runs-on: ubuntu-latest
    needs: build_and_test

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_PASSWORD }}
      
      - name: Inject API URL for Frontend build
        run: echo "REACT_APP_API_URL=${{ secrets.REACT_APP_API_URL }}" > ./frontend/.env

      - name: Build and push Backend Docker image
        uses: docker/build-push-action@v4
        with:
          context: ./backend
          file: ./backend/Dockerfile  
          push: true
          tags: ${{ secrets.DOCKER_HUB_USERNAME }}/devops-group-2-backend:latest

      - name: Build and push Frontend Docker image
        uses: docker/build-push-action@v4
        with:
          context: ./frontend
          file: ./frontend/Dockerfile 
          push: true
          tags: ${{ secrets.DOCKER_HUB_USERNAME }}/devops-group-2-frontend:latest

  deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest
    needs: push-to-docker
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Trigger Backend Deployment
        run: |
          curl -X POST ${{ secrets.RENDER_BACKEND_HOOK }}
          
      - name: Trigger Frontend Deployment
        run: |
          curl -X POST ${{ secrets.RENDER_FRONTEND_HOOK }}