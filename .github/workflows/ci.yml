name: CI Pipeline

on:
  push:
  pull_request:

jobs:
  build_backend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - working-directory: backend
        run: npm install

  test_backend:
    needs: build_backend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - working-directory: backend
        run: npm install

      - working-directory: backend
        run: npm test

  build_frontend:
    needs: test_backend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - working-directory: frontend
        run: npm install

      - working-directory: frontend
        run: npm run build